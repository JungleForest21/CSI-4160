name: Deploy Weather App

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and AWS CLI
        run: |
          python -m pip install --upgrade pip
          pip install ansible awscli

      - name: Build backend environment file
        run: |
          cat > backend/.env <<EOF
          OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }}
          CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}
          EOF
          chmod 600 backend/.env

      - name: Build Ansible inventory
        run: |
          cat > ansible/inventory.ini <<EOF
          [weather]
          ${EC2_HOST} ansible_user=${EC2_USER} ansible_ssh_private_key_file=$HOME/.ssh/deploy_key
          EOF

      - name: Install SSH key
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.ssh"
          cat <<'EOF' > "$HOME/.ssh/deploy_key"
          ${{ secrets.EC2_SSH_KEY }}
          EOF
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null
          ssh-keyscan -H "${EC2_HOST}" >> "$HOME/.ssh/known_hosts"

      - name: Backend sanity check
        run: |
          python -m compileall backend

      - name: Frontend sanity check
        run: |
          test -f frontend/index.html

      - name: Deploy backend with Ansible
        working-directory: ansible
        run: |
          ansible-playbook -i inventory.ini deploy.yml

      - name: Deploy frontend to S3
        run: |
          aws s3 sync frontend/ "s3://${S3_BUCKET_NAME}" --delete --region "${AWS_REGION}"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
