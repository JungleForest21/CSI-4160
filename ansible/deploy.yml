---
- name: Deploy Weather App Backend
  hosts: weather
  become: true

  vars:
    app_dir: /home/ubuntu/weather-app/backend

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-venv
          - python3-pip
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present

    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy main.py
      ansible.builtin.copy:
        src: ../backend/main.py
        dest: "{{ app_dir }}/main.py"
        owner: ubuntu
        group: ubuntu
        mode: '0644'
      notify: Restart weather service

    - name: Copy requirements.txt
      ansible.builtin.copy:
        src: ../backend/requirements.txt
        dest: "{{ app_dir }}/requirements.txt"
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Copy environment file
      ansible.builtin.copy:
        src: ../backend/.env
        dest: "{{ app_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: '0600'
      notify: Restart weather service

    - name: Ensure virtual environment exists
      ansible.builtin.command: python3 -m venv {{ app_dir }}/venv
      args:
        creates: "{{ app_dir }}/venv"

    - name: Install Python requirements
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/venv"
      register: pip_install_result

    - name: Restart weather service if packages changed
      ansible.builtin.systemd:
        name: weather
        state: restarted
      when: pip_install_result.changed

    - name: Copy systemd service file
      ansible.builtin.copy:
        src: files/weather.service
        dest: /etc/systemd/system/weather.service
        owner: root
        group: root
        mode: '0644'
      notify:
        - Reload systemd
        - Restart weather service

    - name: Enable and start weather service
      ansible.builtin.systemd:
        name: weather
        enabled: yes
        state: started

    - name: Remove default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Copy nginx config
      ansible.builtin.template:
        src: templates/nginx-weather.conf.j2
        dest: /etc/nginx/sites-available/weather
        owner: root
        group: root
        mode: '0644'
      notify: Reload nginx

    - name: Enable nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/weather
        dest: /etc/nginx/sites-enabled/weather
        state: link
        force: yes
      notify: Reload nginx

    - name: Validate nginx config
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Enable and start nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: yes
        state: started

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Check weather service status
      ansible.builtin.command: systemctl is-active weather
      register: weather_status
      changed_when: false

    - name: Print weather service status
      ansible.builtin.debug:
        var: weather_status.stdout

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Restart weather service
      ansible.builtin.systemd:
        name: weather
        state: restarted

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
